Sans', Arial, sans-serif" font-size="27" font-weight="700" fill="#3E6B7A" text-anchor="start">Automated checks</text><text x="132" y="91.32000000000001" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">Lint, PMD, Checkstyle, Sonar, OpenAPI diff, SQL lint, secret scan, ID link check, parity check</text><text x="1256" y="62" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0E2A33" text-anchor="end">By: Jenkins</text><rect x="1182" y="86" width="74" height="31" rx="15.5" fill="#3E6B7A"/><text x="1219" y="109.06" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">AUTO</text><path d="M650,150 L650,168" fill="none" stroke="#5B7480" stroke-width="3" marker-end="url(#ah-muted)" stroke-linejoin="round"/><rect x="70" y="170" width="1160" height="128" rx="16" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3.5"/><rect x="88" y="196" width="76" height="76" rx="12" fill="#0E7C86" stroke="none" stroke-width="2.5"/><text x="126" y="243.6" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">L2</text><text x="182" y="211.64000000000001" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="27" font-weight="700" fill="#0E7C86" text-anchor="start">Role checklist</text><text x="182" y="241.32" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">The stage checklist in T10, each item ticked by the named role with evidence</text><text x="1206" y="212" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0E2A33" text-anchor="end">By: Stage owner</text><rect x="1169" y="236" width="37" height="31" rx="15.5" fill="#C25E3A"/><text x="1187.5" y="259.06" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text><path d="M650,300 L650,318" fill="none" stroke="#5B7480" stroke-width="3" marker-end="url(#ah-muted)" stroke-linejoin="round"/><rect x="120" y="320" width="1060" height="128" rx="16" fill="#FFFFFF" stroke="#C25E3A" stroke-width="3.5"/><rect x="138" y="346" width="76" height="76" rx="12" fill="#C25E3A" stroke="none" stroke-width="2.5"/><text x="176" y="393.6" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">L3</text><text x="232" y="361.64" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="27" font-weight="700" fill="#C25E3A" text-anchor="start">Independent review</text><text x="232" y="391.32" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">A second person, never the AI operator, compares output with the approved</text><text x="232" y="416.52" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">input using V1 to V10</text><text x="1156" y="362" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0E2A33" text-anchor="end">By: Reviewer</text><rect x="1119" y="386" width="37" height="31" rx="15.5" fill="#C25E3A"/><text x="1137.5" y="409.06" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text><path d="M650,450 L650,468" fill="none" stroke="#5B7480" stroke-width="3" marker-end="url(#ah-muted)" stroke-linejoin="round"/><rect x="170" y="470" width="960" height="128" rx="16" fill="#FFFFFF" stroke="#B87D14" stroke-width="3.5"/><rect x="188" y="496" width="76" height="76" rx="12" fill="#B87D14" stroke="none" stroke-width="2.5"/><text x="226" y="543.6" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text><text x="282" y="511.64000000000004" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="27" font-weight="700" fill="#B87D14" text-anchor="start">Recorded sign-off</text><text x="282" y="541.32" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">T10 gate record: artifact version, Context Pack version, reviewer,</text><text x="282" y="566.5200000000001" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="400" fill="#1E3640" text-anchor="start">date, decision</text><text x="1106" y="512" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#0E2A33" text-anchor="end">By: Gate owner</text><rect x="1069" y="536" width="37" height="31" rx="15.5" fill="#C25E3A"/><text x="1087.5" y="559.06" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text><rect x="220" y="630" width="860" height="72" rx="12" fill="#0E2A33" stroke="none" stroke-width="2.5"/><text x="650" y="673.68" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">The gate opens only when all four levels are complete and recorded</text><path d="M650,600 L650,626" fill="none" stroke="#5B7480" stroke-width="3" marker-end="url(#ah-muted)" stroke-linejoin="round"/></svg>
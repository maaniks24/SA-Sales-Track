ll="#3E6B7A" text-anchor="middle">Service request</text><text x="1135" y="828.4" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3640" text-anchor="middle">When: Data, configuration or</text><text x="1135" y="852.4" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3640" text-anchor="middle">access change</text><text x="1135" y="882.4" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3640" text-anchor="middle">Path: T05, scripted reviewed</text><text x="1135" y="906.4" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" fill="#1E3640" text-anchor="middle">change, verify</text><text x="1135" y="935.4799999999999" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="19" font-weight="400" font-style="italic" fill="#5B7480" text-anchor="middle">Section 5.3</text><rect x="150" y="980" width="1000" height="62" rx="10" fill="#FDF6E6" stroke="#B87D14" stroke-width="2.5"/><text x="650" y="1018.0400000000001" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="22" font-weight="700" fill="#0E2A33" text-anchor="middle">Unsure? The Architect decides within one working day. Default to the stricter path.</text></svg>